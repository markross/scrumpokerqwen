# SonarQube Cloud analysis config (scan runs in .github/workflows/sonarqube.yml)
# Dashboard: https://sonarcloud.io/project/overview?id=markross_scrumpokerqwen
sonar.projectKey=markross_scrumpokerqwen
sonar.organization=markross
sonar.sourceEncoding=UTF-8

# Our own code only — generated output stays out (node_modules/ and dist/ are
# gitignored but sit on disk during the scan, so exclude them explicitly)
sonar.sources=server,client,shared
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.ts

# Vitest specs count as tests, not sources
sonar.tests=.
sonar.test.inclusions=**/*.test.ts
sonar.test.exclusions=**/node_modules/**,**/dist/**

# Point the TypeScript analyzer at the real tsconfigs instead of a
# filesystem-wide search (server/tsconfig.json also covers shared/)
sonar.typescript.tsconfigPaths=server/tsconfig.json,client/tsconfig.json
